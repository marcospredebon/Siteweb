name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.151.2"
      HUGO_ENVIRONMENT: production
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.151.2"
          extended: true

      - name: Build site
        run: hugo --minify --destination public --baseURL "https://marcospredebon.github.io/Siteweb/"

      - name: Verify index.html exists
        run: |
          test -f public/index.html
          ls -la public
          ls -la public/css || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          # Garante que o Pages não processe o site com Jekyll
          enable_jekyll: false
