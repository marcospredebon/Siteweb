name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.151.2"
      HUGO_ENVIRONMENT: production
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.151.2"
          extended: true

      - name: Build site
        run: hugo --minify --destination public --baseURL "https://marcospredebon.github.io/Siteweb/"

      - name: Verify built homepage is Hugo HTML
        run: |
          test -f public/index.html
          grep -q "Tecnologia e Criatividade" public/index.html
          if grep -q "Não é um projeto Node" public/index.html; then
            echo "Build produced README content instead of the Hugo homepage"
            exit 1
          fi

      - name: Point GitHub Pages to the gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "build_type": "legacy",
            "source": {
              "branch": "gh-pages",
              "path": "/"
            }
          }
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          enable_jekyll: false
