{{ define "main" }}
<article class="single-page">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if .Description }}
      <p class="description">{{ .Description }}</p>
    {{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <nav class="post-nav">
    {{ with .PrevInSection }}
      <a href="{{ .RelPermalink }}" class="prev-post">← {{ .Title }}</a>
    {{ end }}
    {{ with .NextInSection }}
      <a href="{{ .RelPermalink }}" class="next-post">{{ .Title }} →</a>
    {{ end }}
  </nav>
</article>
{{ end }}
